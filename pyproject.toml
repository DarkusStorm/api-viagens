[project]
name = "api-viagens"
version = "0.1.0"
description = "API de app de viagens com FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
]

[tool.fastapi]
entry-point = "app.main:app"
# from app.main.import app as app

env-file = ".env"
